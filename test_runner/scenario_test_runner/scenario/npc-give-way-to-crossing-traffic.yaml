# The right-turning NPC must give way to the oncoming NPC going straight.
ScenarioModifiers:
  ScenarioModifier: []
OpenSCENARIO:
  FileHeader: { revMajor: 1, revMinor: 1, date: '2026-10-20T00:00:00+09:00', description: 'NPC must give way to crossing traffic', author: 'Shota Minami' }
  ParameterDeclarations:
    ParameterDeclaration: []
  CatalogLocations:
  RoadNetwork:
    LogicFile: { filepath: "$(find-pkg-share scenario_test_maps)/map/intersection_with_right_of_way/lanelet2_map.osm" }
    TrafficSignals:
  Entities:
    ScenarioObject:
      # Enters the intersection from the west and turns right across the oncoming lane.
      - name: turning-npc
        Vehicle: &DEFAULT_VEHICLE
          name: default-vehicle
          vehicleCategory: car
          BoundingBox:
            Center: { x: 0, y: 0, z: 0 }
            Dimensions: { width: 2.25, length: 4.77, height: 2.5 }
          Performance: { maxSpeed: 50, maxAcceleration: INF, maxDeceleration: INF }
          Axles:
            FrontAxle: { maxSteering: 3.1415, wheelDiameter: 0.6, trackWidth: 4, positionX:  1, positionZ: 0.3 }
            RearAxle:  { maxSteering: 3.1415, wheelDiameter: 0.6, trackWidth: 4, positionX: -1, positionZ: 0.3 }
          Properties:
            Property: []
      # Comes the other way and goes straight through.
      - name: crossing-npc
        Vehicle: *DEFAULT_VEHICLE
  Storyboard:
    Init:
      Actions:
        Private:
          - entityRef: turning-npc
            PrivateAction:
              - TeleportAction:
                  Position:
                    LanePosition:
                      roadId: ''
                      laneId: '1'
                      s: 42
                      offset: 0
                      Orientation: &DEFAULT_ORIENTATION { type: relative, h: 0, p: 0, r: 0 }
              - LongitudinalAction:
                  SpeedAction:
                    SpeedActionDynamics: { dynamicsShape: step, dynamicsDimension: time, value: 0 }
                    SpeedActionTarget:
                      AbsoluteTargetSpeed: { value: 10 }
              - RoutingAction:
                  AcquirePositionAction:
                    Position:
                      LanePosition: &TURNING_NPC_DESTINATION
                        roadId: ''
                        laneId: '4'
                        s: 10
                        offset: 0
                        Orientation: *DEFAULT_ORIENTATION
          - entityRef: crossing-npc
            PrivateAction:
              - TeleportAction:
                  Position:
                    LanePosition:
                      roadId: ''
                      laneId: '5'
                      s: 16
                      offset: 0
                      Orientation: *DEFAULT_ORIENTATION
              - LongitudinalAction:
                  SpeedAction:
                    SpeedActionDynamics: { dynamicsShape: step, dynamicsDimension: time, value: 0 }
                    SpeedActionTarget:
                      AbsoluteTargetSpeed: { value: 14 }
              - RoutingAction:
                  AcquirePositionAction:
                    Position:
                      LanePosition:
                        roadId: ''
                        laneId: '2'
                        s: 10
                        offset: 0
                        Orientation: *DEFAULT_ORIENTATION
    Story:
      - name: story
        Act:
          - name: act
            ManeuverGroup:
              - name: maneuver-group
                maximumExecutionCount: 1
                Actors:
                  selectTriggeringEntities: false
                  EntityRef: [ entityRef: turning-npc ]
                Maneuver:
                  - name: give-way-to-crossing-traffic
                    Event:
                      - name: success
                        priority: parallel
                        Action:
                          - name: (exit-success)
                            UserDefinedAction:
                              CustomCommandAction: { type: exitSuccess }
                        StartTrigger:
                          ConditionGroup:
                            - Condition:
                                - name: (turn-is-complete?)
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef: [ entityRef: turning-npc ]
                                    EntityCondition:
                                      DistanceCondition:
                                        coordinateSystem: lane
                                        relativeDistanceType: longitudinal
                                        freespace: true
                                        rule: lessThan
                                        value: 0.0
                                        Position:
                                          LanePosition: *TURNING_NPC_DESTINATION

                      # These two positions are where the turn runs into the oncoming lane and
                      # where that lane runs into the turn. A distance below zero means the front
                      # of the vehicle is past its position, so the pair says the turn went into
                      # the overlap while the traffic it gives way to had yet to reach it.
                      - name: failure-entered-the-oncoming-lane-too-early
                        priority: parallel
                        Action:
                          - name: (exit-failure)
                            UserDefinedAction:
                              CustomCommandAction: { type: exitFailure }
                        StartTrigger:
                          ConditionGroup:
                            - Condition:
                                - name: (front-of-bounding-box-is-in-the-oncoming-lane?)
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef: [ entityRef: turning-npc ]
                                    EntityCondition:
                                      DistanceCondition:
                                        coordinateSystem: lane
                                        relativeDistanceType: longitudinal
                                        freespace: true
                                        rule: lessThan
                                        value: 0.0
                                        # Where the turn enters the polygon of lane 16.
                                        Position:
                                          LanePosition:
                                            roadId: ''
                                            laneId: '11'
                                            s: 7.0
                                            offset: 0
                                            Orientation: *DEFAULT_ORIENTATION
                                - name: (crossing-npc-has-not-passed-yet?)
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef: [ entityRef: crossing-npc ]
                                    EntityCondition:
                                      DistanceCondition:
                                        coordinateSystem: lane
                                        relativeDistanceType: longitudinal
                                        freespace: true
                                        rule: greaterThan
                                        value: 0.0
                                        # Where lane 16 enters the polygon of the turn.
                                        Position:
                                          LanePosition:
                                            roadId: ''
                                            laneId: '16'
                                            s: 8.6
                                            offset: 0
                                            Orientation: *DEFAULT_ORIENTATION

                      - name: failure-collided
                        priority: parallel
                        Action:
                          - name: (exit-failure)
                            UserDefinedAction:
                              CustomCommandAction: { type: exitFailure }
                        StartTrigger:
                          ConditionGroup:
                            - Condition:
                                - name: (collided?)
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef: [ entityRef: turning-npc ]
                                    EntityCondition:
                                      CollisionCondition:
                                        EntityRef:
                                          entityRef: crossing-npc

                      - name: failure-timed-out
                        priority: parallel
                        Action:
                          - name: (exit-failure)
                            UserDefinedAction:
                              CustomCommandAction: { type: exitFailure }
                        StartTrigger:
                          ConditionGroup:
                            - Condition:
                                - name: (timed-out?)
                                  delay: 0
                                  conditionEdge: none
                                  ByValueCondition:
                                    SimulationTimeCondition: { value: 30, rule: greaterThan }
            StartTrigger:
              ConditionGroup:
                - Condition:
                    - name: ''
                      delay: 0
                      conditionEdge: none
                      ByValueCondition:
                        SimulationTimeCondition: { value: 0, rule: greaterThan }
    StopTrigger:
      ConditionGroup: []
