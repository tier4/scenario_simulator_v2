                                  delay: 0
                                  conditionEdge: none
                                  ByValueCondition:
                                    SimulationTimeCondition:
                                      value: 60
                                      rule: greaterThan
                            - Condition:
                                - name: 'evaluate time checker'
                                  delay: 0
                                  conditionEdge: none
                                  ByValueCondition:
                                    UserDefinedValueCondition:
                                      name: /simulation/interpreter/execution_time/evaluate
                                      rule: greaterThan
                                      value: 0.001
                                - name: 'avoid startup'
                                  delay: 0
                                  conditionEdge: none
                                  ByValueCondition:
                                    SimulationTimeCondition:
                                      value: 1
                                      rule: greaterThan
                            - Condition:
                                - name: 'update time checker'
                                  delay: 0
                                  conditionEdge: none
                                  ByValueCondition:
