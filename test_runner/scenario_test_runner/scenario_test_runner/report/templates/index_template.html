<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title x-text="data.title">Index</title>
  <style>
    :root {
      --size-1: 0.25rem; --size-2: 0.5rem; --size-3: 1rem;
      --size-4: 1.25rem; --size-5: 1.5rem;
      --radius-2: 5px;
      --font-sans: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      --font-lineheight-3: 1.7;
      --fs-base: 1rem; --fs-sm: 0.875rem; --fs-xs: 0.75rem;
      --surface-1: #f6f8fa; --surface-2: #ffffff; --surface-3: #eaedf1;
      --text: #4b5563; --border-dim: #d8dee4;
      --accent: #0969da; --danger: #d1242f; --success: #1a7f37;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.02);
      color-scheme: light;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--font-sans); font-size: var(--fs-sm);
      line-height: var(--font-lineheight-3); color: var(--text);
      background: var(--surface-1);
    }
    .container { max-width: 1400px; margin: 0 auto; padding: var(--size-4) var(--size-3); }
    h1 { font-size: var(--fs-base); font-weight: 600; margin: 0; }
    .subtitle { font-size: var(--fs-xs); margin: var(--size-1) 0 0; opacity: 0.6; }
    .header { margin-bottom: var(--size-3); }
    h2 {
      font-size: var(--fs-sm); font-weight: 600; margin: var(--size-5) 0 var(--size-2);
      color: var(--text); text-transform: uppercase; letter-spacing: 0.04em;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .breadcrumb { font-size: var(--fs-xs); margin-bottom: var(--size-3); }
    .breadcrumb a { color: var(--text); }
    table {
      width: 100%; border-collapse: separate; border-spacing: 0;
      background: var(--surface-2); border: 1px solid var(--border-dim);
      border-radius: var(--radius-2); box-shadow: var(--card-shadow);
      font-variant-numeric: tabular-nums; font-size: var(--fs-xs);
    }
    th, td {
      padding: 8px 12px; text-align: left;
      border-bottom: 1px solid var(--border-dim); color: var(--text);
    }
    th { background: var(--surface-3); font-weight: 500; }
    tr:last-child td { border-bottom: none; }
    .status { font-weight: 600; }
    .status-succeeded { color: var(--success); }
    .status-failed { color: var(--danger); }
    .count { font-variant-numeric: tabular-nums; }
    .num-comp-wrap {
      overflow-x: auto; margin-top: var(--size-3);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-2);
      box-shadow: var(--card-shadow);
      background: var(--surface-2);
    }
    .num-comp {
      width: max-content; min-width: 100%;
      border-collapse: separate; border-spacing: 0;
      font-size: var(--fs-xs); font-variant-numeric: tabular-nums;
    }
    .num-comp th, .num-comp td {
      padding: 8px 10px;
      border-right: 1px solid var(--border-dim);
      border-bottom: 1px solid var(--border-dim);
      text-align: left; color: var(--text); white-space: nowrap;
    }
    .num-comp th:last-child, .num-comp td:last-child { border-right: none; }
    .num-comp tbody tr:last-child td { border-bottom: none; }
    .num-comp th {
      background: var(--surface-3); font-weight: 500;
      font-size: var(--fs-xs); color: var(--text);
    }
    .num-comp tr.group-header th {
      text-align: center; font-size: var(--fs-xs); color: var(--text);
    }
    .num-comp tr.highlight td {
      background: color-mix(in srgb, var(--accent) 10%, var(--surface-2));
      font-weight: 600;
    }
    .num-comp .nc-model {
      position: sticky; left: 0; z-index: 1;
      min-width: 140px; max-width: 200px; width: 200px;
      overflow: hidden; text-overflow: ellipsis;
    }
    .num-comp thead .nc-model { background: var(--surface-3); }
    .num-comp tbody .nc-model { background: var(--surface-2); }
    .num-comp tr.highlight .nc-model {
      background: color-mix(in srgb, var(--accent) 10%, var(--surface-2));
    }
    .num-comp .nc-unit { font-weight: 400; opacity: 0.6; }
    .nc-hint {
      text-decoration: underline dotted var(--text);
      text-underline-offset: 3px; cursor: help;
    }
    .nc-tip {
      display: none; position: fixed; z-index: 20;
      max-width: 200px; padding: 6px 10px;
      background: var(--surface-1); color: var(--text);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-2);
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      font-size: var(--fs-xs); font-weight: 400;
      line-height: 1.5; pointer-events: none;
    }
    .nc-tip .nb { white-space: nowrap; }
    .nc-tip.visible { display: block; }
    .nc-caption { font-size: var(--fs-xs); opacity: 0.6; margin-top: var(--size-1); }
  </style>
</head>
<body>

  <script type="application/json" id="index-data">{{INDEX_DATA}}</script>

  <div class="container" x-data="indexPage()">
    <!-- Breadcrumb -->
    <div class="breadcrumb">
      <template x-for="bc in data.breadcrumbs">
        <span><a :href="bc.href" x-text="bc.label"></a> / </span>
      </template>
      <span x-text="data.title"></span>
    </div>

    <div class="header">
      <h1 x-text="data.title"></h1>
      <p class="subtitle" x-show="data.subtitle" x-text="data.subtitle"></p>
    </div>

    <!-- Numerical Comparison table -->
    <template x-if="numcomp.length > 0">
      <div>
        <h2>Numerical Comparison</h2>
        <div class="num-comp-wrap">
          <table class="num-comp">
            <thead>
              <tr class="group-header">
                <template x-for="(g, gi) in groups" :key="'g'+gi">
                  <th :colspan="g.cols.length" x-text="g.header"
                      :class="g.cols[0].key === 'model' && 'nc-model'"></th>
                </template>
              </tr>
              <tr>
                <template x-for="(c, ci) in allCols" :key="'h'+ci">
                  <th :class="c.key === 'model' && 'nc-model'">
                    <span :class="c.tip && 'nc-hint'" :data-tip="c.tip"
                          @mouseenter="showTip" @mouseleave="hideTip"
                          x-text="c.label"></span><br x-show="c.unit"><span class="nc-unit" x-show="c.unit" x-text="'[' + c.unit + ']'"></span>
                  </th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template x-for="(row, ri) in numcomp" :key="'r'+ri">
                <tr :class="ri === 0 && 'highlight'">
                  <template x-for="(c, ci) in allCols" :key="'d'+ci">
                    <td :class="c.key === 'model' && 'nc-model'"
                        :style="c.key === 'model' ? 'border-left:10px solid ' + row.color : ''"
                        :title="c.key === 'model' ? row.model : null">
                      <template x-if="c.key === 'model'">
                        <span x-text="row.model"></span>
                      </template>
                      <template x-if="c.key !== 'model'">
                        <span x-text="fmtVal(row[c.key])"></span>
                      </template>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <p class="nc-caption" x-text="data.numcomp_count + ' scenarios aggregated'"></p>
        <div class="nc-tip" :class="{ visible: tipVisible }"
             :style="'left:' + tipX + 'px;top:' + tipY + 'px'"
             x-html="tipText"></div>
      </div>
    </template>

    <!-- Catalog mode: suite list -->
    <template x-if="data.mode === 'catalog'">
      <div>
        <h2>Suites</h2>
        <table>
          <thead><tr>
            <th>Suite</th><th>Status</th><th>Scenarios</th>
            <th>Succeeded</th><th>Failed</th>
          </tr></thead>
          <tbody>
            <template x-for="s in data.items">
              <tr>
                <td><a :href="s.name + '/index.html'" x-text="s.name"></a></td>
                <td class="status" :class="statusClass(s.status)" x-text="s.status"></td>
                <td class="count" x-text="s.total"></td>
                <td class="count status-succeeded" x-text="s.succeeded"></td>
                <td class="count status-failed" x-text="s.failed"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>

    <!-- Suite mode: scenario list -->
    <template x-if="data.mode === 'suite'">
      <div>
        <h2>Scenarios</h2>
        <table>
          <thead><tr>
            <th>Scenario</th><th>Status</th>
          </tr></thead>
          <tbody>
            <template x-for="sc in data.items">
              <tr>
                <td>
                  <a x-show="sc.has_report" :href="sc.name + '/report.html'" x-text="sc.name"></a>
                  <span x-show="!sc.has_report" x-text="sc.name"></span>
                </td>
                <td class="status" :class="statusClass(sc.status)" x-text="sc.status"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>
  </div>

  <script>
  "use strict";

  const GROUPS = [
    { header: '', cols: [
      { key: 'model', label: 'Model' },
    ]},
    { header: 'Correspondence', cols: [
      { key: 'match_valid_pct', label: 'Valid', unit: '%',
        tip: 'Share of samples with <span class="nb">lateral distance ≤ 15 m</span>' },
      { key: 'median_lateral_m', label: 'Median lateral', unit: 'm',
        tip: 'Median lateral distance at arc-length matched points' },
      { key: 'max_lateral_m', label: 'Max lateral', unit: 'm',
        tip: 'Maximum lateral distance at arc-length matched points' },
    ]},
    { header: 'Speed difference', cols: [
      { key: 'mean_dv', label: 'Mean Δv', unit: 'm/s',
        tip: 'Mean speed difference <span class="nb">(model − baseline)</span>' },
      { key: 'median_dv', label: 'Median Δv', unit: 'm/s',
        tip: 'Median speed difference <span class="nb">(model − baseline)</span>' },
      { key: 'avg_over', label: 'Avg overspeed', unit: 'm/s',
        tip: 'Mean of positive Δv <span class="nb">(model faster than baseline)</span>' },
      { key: 'avg_under', label: 'Avg underspeed', unit: 'm/s',
        tip: 'Mean of negative Δv <span class="nb">(model slower than baseline)</span>' },
      { key: 'peak_over', label: 'Peak Δv+', unit: 'm/s',
        tip: 'Largest positive Δv <span class="nb">(max excess over baseline)</span>' },
      { key: 'peak_under', label: 'Peak Δv−', unit: 'm/s',
        tip: 'Largest negative Δv <span class="nb">(max deficit vs baseline)</span>' },
    ]},
    { header: 'Turn indicator', cols: [
      { key: 'ti_clusters', label: 'Clusters',
        tip: 'Turn-indicator clusters on the baseline path' },
      { key: 'ti_missing', label: 'Missing',
        tip: 'Baseline clusters with no matching model signal' },
      { key: 'ti_mean_iou', label: 'Mean IoU',
        tip: 'Arc-length IoU of matched turn-indicator clusters' },
    ]},
    { header: 'Operational', cols: [
      { key: 'strong_brakes', label: 'Strong brakes',
        tip: 'Consecutive intervals with <span class="nb">acceleration ≤ −1.0 m/s²</span>' },
    ]},
  ];
  const ALL_COLS = GROUPS.flatMap(g => g.cols);

  function fmtVal(v) {
    if (v == null || (typeof v === "number" && !isFinite(v))) return "—";
    if (typeof v === "number") {
      if (Number.isInteger(v) || v === Math.trunc(v)) return String(Math.trunc(v));
      return Math.abs(v) < 10 ? v.toFixed(3) : v.toFixed(1);
    }
    return String(v);
  }

  function indexPage() {
    const data = JSON.parse(document.getElementById("index-data").textContent);
    return {
      data,
      groups: GROUPS,
      allCols: ALL_COLS,
      numcomp: data.numcomp || [],
      tipVisible: false,
      tipText: '',
      tipX: 0,
      tipY: 0,
      fmtVal,
      statusClass(s) {
        if (s === "succeeded" || s === "failed") return "status-" + s;
        return "";
      },
      showTip(e) {
        const tip = e.target.dataset.tip;
        if (!tip) return;
        this.tipText = tip;
        const r = e.target.getBoundingClientRect();
        this.tipX = r.left;
        this.tipY = r.bottom + 6;
        this.tipVisible = true;
      },
      hideTip() { this.tipVisible = false; },
    };
  }
  </script>

  {{ALPINE_SCRIPT}}
</body>
</html>
