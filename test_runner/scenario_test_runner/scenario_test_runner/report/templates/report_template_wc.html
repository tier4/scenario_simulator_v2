<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trajectory Report</title>
  <style>
    /* --- Design tokens (inherited by Shadow DOM via CSS custom properties) --- */
    :root {
      --size-1: 0.25rem;
      --size-2: 0.5rem;
      --size-3: 1rem;
      --size-4: 1.25rem;
      --size-5: 1.5rem;
      --size-7: 2.5rem;
      --radius-1: 2px;
      --radius-2: 5px;
      --radius-round: 1e5px;
      --font-sans: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      --font-lineheight-3: 1.7;
      --fs-base: 1rem;
      --fs-sm: 0.875rem;
      --fs-xs: 0.75rem;
      --surface-1: #f6f8fa;
      --surface-2: #ffffff;
      --surface-3: #eaedf1;
      --text: #4b5563;
      --border-dim: #d8dee4;
      --accent: #0969da;
      --danger: #d1242f;
      --success: #1a7f37;
      --sf-canvas-h: 380px;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.02);
      color-scheme: light;
    }

    /* --- Reset + Base --- */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: var(--fs-base);
      line-height: var(--font-lineheight-3);
      color: var(--text);
      background: var(--surface-1);
    }
    h3 {
      margin: var(--size-5) 0 var(--size-2);
      font-size: var(--fs-base);
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding-bottom: 0;
      border-bottom: none;
    }
    h3:first-child { margin-top: 0; }
    img, svg, canvas { max-width: 100%; display: block; }
    [x-cloak] { display: none !important; }

    /* --- Layout --- */
    .container { max-width: 1400px; margin: 0 auto; padding: var(--size-4) var(--size-3) var(--size-7); }
    .row { display: grid; grid-template-columns: 3fr 1fr; gap: var(--size-3); min-width: 0; }
    .row > * { min-width: 0; }
    @media (max-width: 768px) { .row { grid-template-columns: 1fr; } }
  </style>

  <!-- Shared styles adopted by all Shadow DOM roots via adoptedStyleSheets -->
  <style id="shared-wc-styles" media="not all">
    :host { display: block; }

    .controls {
      display: flex;
      align-items: center;
      gap: var(--size-2);
      margin: var(--size-2) 0;
      flex-wrap: wrap;
      font-size: var(--fs-sm);
      color: var(--text);
    }
    .controls input[type=range] {
      flex: 1;
      min-width: 120px;
      border: none;
      padding: 0;
    }
    .controls small {
      color: var(--text);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      min-width: 10ch;
      text-align: right;
    }

    select {
      font-family: inherit;
      font-size: var(--fs-sm);
      padding: var(--size-1) var(--size-2);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-2);
      background: var(--surface-2);
      color: var(--text);
    }

    input[type=checkbox],
    input[type=radio] {
      accent-color: var(--accent);
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--fs-sm);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    .toggle-label input {
      margin: 0;
      accent-color: var(--accent);
    }

    .card {
      background: var(--surface-2);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-2);
      box-shadow: var(--card-shadow);
    }
  </style>
</head>
<body>

  <!-- ============================================================
       Layout shell
       ============================================================ -->
  <main class="container" x-data x-cloak>
  <template x-if="$store.data.map">
    <div>
    <h3>Trajectory Comparison</h3>
    <div class="row">
      <map-canvas></map-canvas>
      <legend-panel></legend-panel>
    </div>
    <plots-panel></plots-panel>
    <h3>Numerical Comparison</h3>
    <num-comp></num-comp>
    <h3>Trajectory Overview</h3>
    <static-figures-panel></static-figures-panel>
    </div>
  </template>
  </main>

  <!-- ============================================================
       Embedded report data
       ============================================================ -->
  <script type="application/gzip+base64" id="report-data">{{DATA_B64GZ}}</script>

  <!-- ============================================================
       Shared: utilities, constants, stores, shared stylesheet
       ============================================================ -->
  <script>
  "use strict";

  function decodeGz(id) {
    const gz = Uint8Array.from(atob(document.getElementById(id).textContent.trim()), c => c.charCodeAt(0));
    const ds = new DecompressionStream('gzip');
    const w = ds.writable.getWriter();
    w.write(gz);
    w.close();
    return new Response(ds.readable).text();
  }

  const reportData = decodeGz('report-data').then(t => JSON.parse(t));

  const CHANNELS = ["velocity", "accel", "heading_rate", "steer"];
  const CH_LABELS = {
    velocity: {name: "Velocity", units: ["m/s"]},
    accel: {name: "Accel", units: ["m/s²"]},
    heading_rate: {name: "Yaw Rate", units: ["rad/s", "deg/s"], conv: [1, 180/Math.PI]},
    steer: {name: "Steer", units: ["deg", "rad"], conv: [1, Math.PI/180]},
  };
  const CH_CMD = {velocity: "cmd_velocity", accel: "cmd_accel", steer: "cmd_steer"};
  const chUnit = {};
  CHANNELS.forEach(ch => { chUnit[ch] = 0; });

  let _dirty = true;
  function markDirty() { _dirty = true; }

  function upperBound(arr, val, n) {
    let lo = 0, hi = n;
    while (lo < hi) { const m = (lo + hi) >> 1; arr[m] <= val ? lo = m + 1 : hi = m; }
    return lo;
  }

  function niceScaleBar(pxPerMeter) {
    const candidates = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000];
    let best = candidates[0];
    for (let i = 0; i < candidates.length; i++) {
      const px = candidates[i] * pxPerMeter;
      if (px >= 60 && px <= 200) { best = candidates[i]; break; }
      if (px < 300) best = candidates[i];
    }
    return { meters: best, px: best * pxPerMeter };
  }

  function closestPlanned(planned, t) {
    if (!planned || !planned.length) return null;
    let lo = 0, hi = planned.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; planned[m].t <= t ? lo = m : hi = m - 1; }
    return planned[lo];
  }

  // --- Shared CSSStyleSheet adopted by all shadow roots ---
  const _sharedSheet = new CSSStyleSheet();
  _sharedSheet.replaceSync(
    document.getElementById('shared-wc-styles').textContent
  );

  function defineAlpineElement(tag, tmplId) {
    customElements.define(tag, class extends HTMLElement {
      connectedCallback() {
        this.attachShadow({ mode: 'open' });
        this.shadowRoot.adoptedStyleSheets = [_sharedSheet];
        this.shadowRoot.appendChild(
          document.getElementById(tmplId).content.cloneNode(true)
        );
        Alpine.initTree(this.shadowRoot.getElementById('root'));
      }
      disconnectedCallback() {
        Alpine.destroyTree(this.shadowRoot.getElementById('root'));
      }
    });
  }

  // --- Alpine stores ---
  document.addEventListener('alpine:init', () => {

    Alpine.store('data', {
      rate: 0, models: [], map: null, bbox: null,
      async init() {
        const raw = await reportData;
        this.rate = raw.rate_hz;
        this.models = raw.models;
        this.map = raw.map;
        this.bbox = raw.bbox;
        markDirty();
      },
      sampleAtT(run, t) {
        const nv = run.n_valid;
        if (nv < 2) return null;
        const last = run.x.length - 1;
        const fi = Math.min(Math.max(t * this.rate, 0), last);
        const i = Math.floor(fi);
        const j = Math.min(i + 1, last);
        const f = fi - i;
        const L = a => a[i] + (a[j] - a[i]) * f;
        const tEnd = (nv - 1) / this.rate;
        const ended = t > tEnd + 1e-9;
        return { x: L(run.x), y: L(run.y), yaw: L(run.yaw), s: L(run.s),
                 v: ended ? 0 : L(run.v), t: Math.min(t, tEnd), ended: ended };
      },
      sampleAtS(run, s) {
        const nv = run.n_valid;
        if (nv < 2) return null;
        const sc = Math.min(Math.max(s, 0), run.s_total);
        let j = upperBound(run.s, sc, nv);
        j = Math.min(Math.max(j, 1), nv - 1);
        const ii = j - 1;
        const ds = run.s[j] - run.s[ii];
        const f = ds > 1e-9 ? (sc - run.s[ii]) / ds : 0;
        const L = a => a[ii] + (a[j] - a[ii]) * f;
        const ended = sc >= run.s_total - 1e-9;
        return { x: L(run.x), y: L(run.y), yaw: L(run.yaw), s: sc,
                 v: ended ? 0 : L(run.v), t: (ii + f) / this.rate, ended: ended };
      },
      sampleChannel(run, ch, t) {
        const arr = run.ch[ch];
        if (!arr || !arr.length) return null;
        const fi = Math.min(Math.max(t * this.rate, 0), arr.length - 1);
        const i = Math.floor(fi);
        const j = Math.min(i + 1, arr.length - 1);
        if (arr[i] === null || arr[j] === null) return null;
        const f = fi - i;
        return arr[i] + (arr[j] - arr[i]) * f;
      },
      sampleChannelAtS(run, ch, s) {
        const arr = run.ch[ch];
        if (!arr || !arr.length) return null;
        const nv = run.n_valid;
        if (nv < 2) return null;
        const sc = Math.min(Math.max(s, 0), run.s_total);
        let j = upperBound(run.s, sc, nv);
        j = Math.min(Math.max(j, 1), nv - 1);
        const ii = j - 1;
        const ds = run.s[j] - run.s[ii];
        const f = ds > 1e-9 ? (sc - run.s[ii]) / ds : 0;
        if (arr[ii] === null || arr[j] === null) return null;
        return arr[ii] + (arr[j] - arr[ii]) * f;
      },
    });

    Alpine.store('playback', {
      mode: 'pos', playing: false, speedMul: 1,
      curT: 0, curS: 0, maxT: 0, maxS: 0,
      _animId: null, _lastTime: 0,

      async init() {
        const { models, rate_hz } = await reportData;
        this.maxT = Math.max(...models.map(m => m.n_valid > 0 ? (m.n_valid - 1) / rate_hz : 0));
        this.maxS = Math.max(...models.map(m => m.s_total || 0));
      },

      toggle() {
        this.playing = !this.playing;
        if (this.playing) { this._lastTime = performance.now(); this._tick(); }
        else if (this._animId) { cancelAnimationFrame(this._animId); this._animId = null; }
      },
      pause() {
        if (this.playing) { this.playing = false; if (this._animId) { cancelAnimationFrame(this._animId); this._animId = null; } }
      },
      resume() {
        if (!this.playing) { this.playing = true; this._lastTime = performance.now(); this._tick(); }
      },
      _tick() {
        if (!this.playing) return;
        const now = performance.now();
        const dt = (now - this._lastTime) / 1000 * this.speedMul;
        this._lastTime = now;
        if (this.mode === 'time') {
          this.curT += dt;
          if (this.curT > this.maxT) this.curT = 0;
        } else {
          const d = Alpine.store('data');
          const mdl = Alpine.store('models');
          const base = d.models[mdl.baselineIdx];
          if (base && base.n_valid > 1) {
            const st = d.sampleAtS(base, this.curS);
            if (st) {
              const ns = d.sampleAtT(base, st.t + dt);
              this.curS = ns ? ns.s : this.maxS;
            }
          }
          if (this.curS >= this.maxS) this.curS = 0;
        }
        markDirty();
        this._animId = requestAnimationFrame(() => { this._tick(); });
      },
      onModeChange() {
        const d = Alpine.store('data');
        const mdl = Alpine.store('models');
        const base = d.models[mdl.baselineIdx];
        if (!base || base.n_valid < 2) return;
        if (this.mode === 'pos') { const st = d.sampleAtT(base, this.curT); this.curS = st ? st.s : 0; }
        else { const st2 = d.sampleAtS(base, this.curS); this.curT = st2 ? st2.t : 0; }
        markDirty();
      },
      onBaselineChange() {
        if (this.mode === 'pos') {
          const d = Alpine.store('data');
          const mdl = Alpine.store('models');
          const base = d.models[mdl.baselineIdx];
          if (base && base.n_valid > 1) {
            const st = d.sampleAtS(base, this.curS);
            if (st) this.curS = st.s;
          }
        }
        markDirty();
      },
    });

    Alpine.store('camera', {
      cx: 0, cy: 0, viewW: 10, targetViewW: 0, follow: true,
      async init() {
        const { bbox } = await reportData;
        this.cx = (bbox[0] + bbox[2]) / 2;
        this.cy = (bbox[1] + bbox[3]) / 2;
        this.viewW = Math.max(bbox[2] - bbox[0], bbox[3] - bbox[1], 10) * 1.1;
      },
    });
    Alpine.store('models', {
      visible: [], baselineIdx: 0,
      async init() {
        const { models } = await reportData;
        this.visible = models.map(() => true);
      },
    });
    Alpine.store('ui', {
      showPlanned: true, showEntities: true, showPerceived: true,
      plotWindowS: 10, plotWindowM: 50,
    });

  });

  // --- Custom element registration ---
  defineAlpineElement('map-canvas', 'map-canvas-tmpl');
  defineAlpineElement('legend-panel', 'legend-panel-tmpl');
  defineAlpineElement('plots-panel', 'plots-panel-tmpl');
  defineAlpineElement('num-comp', 'num-comp-tmpl');
  defineAlpineElement('static-figures-panel', 'static-figures-tmpl');
  </script>

  <!-- ============================================================
       Component: map-canvas
       ============================================================ -->
  <template id="map-canvas-tmpl">
    <style>
      button {
        font-family: inherit;
        font-size: var(--fs-sm);
        padding: var(--size-1) var(--size-3);
        border: 1px solid var(--border-dim);
        border-radius: var(--radius-2);
        background: transparent;
        color: var(--text);
        cursor: pointer;
        min-width: 6.5em;
      }
      button:hover { background: var(--surface-3); }
      button.active { border-color: var(--accent); color: var(--accent); }
      .play-btn { color: var(--text); }
      .play-btn:hover { color: var(--text); }
      .play-btn.playing { color: var(--accent); border-color: var(--accent); }
      .seg-group {
        display: inline-flex;
        border: 1px solid var(--border-dim);
        border-radius: var(--radius-2);
        overflow: hidden;
      }
      .seg-group button {
        border: none; border-radius: 0; min-width: auto;
        padding: var(--size-1) var(--size-2);
        font-size: var(--fs-sm); color: var(--text);
        background: transparent; line-height: var(--font-lineheight-3);
      }
      .seg-group button:hover { background: var(--surface-3); }
      .seg-group button.active { background: var(--accent); color: #fff; border-color: transparent; }
      .seg-group button + button { border-left: 1px solid var(--border-dim); }
      .baseline-group {
        display: flex; align-items: center; gap: var(--size-1);
        font-size: var(--fs-sm); color: var(--text); white-space: nowrap;
      }
      .baseline-group.disabled { opacity: 0.35; pointer-events: none; }
      .toggle-group {
        display: flex; align-items: center; gap: var(--size-2); flex-wrap: wrap;
      }
      input[type=range] {
        --pct: 0%;
        -webkit-appearance: none; appearance: none;
        height: 6px;
        background: linear-gradient(to right, var(--accent) var(--pct), #ccd1d8 var(--pct));
        border-radius: var(--radius-round);
        outline: none;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 14px; height: 14px;
        border-radius: var(--radius-round);
        background: var(--accent); cursor: pointer;
      }
      input[type=range]::-moz-range-thumb {
        width: 14px; height: 14px; border: none;
        border-radius: var(--radius-round);
        background: var(--accent); cursor: pointer;
      }
      input[type=range]::-moz-range-track {
        height: 6px;
        background: linear-gradient(to right, var(--accent) var(--pct), var(--border-dim) var(--pct));
        border-radius: var(--radius-round);
      }
      .map-wrap {
        position: relative; width: 100%;
        background: var(--surface-2);
        border-radius: var(--radius-2);
        overflow: hidden;
      }
      .map-wrap canvas {
        display: block; position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        cursor: grab;
      }
      .map-wrap canvas:active { cursor: grabbing; }
    </style>
    <div id="root" x-data="mapCanvas">
      <div class="card" style="overflow:hidden">
        <div class="map-wrap" x-ref="mapWrap" style="height:550px">
          <canvas x-ref="mapCvs"
            @mousedown="onMouseDown($event)"
            @mousemove="onMouseMove($event)"
            @mouseup="onMouseUp()"
            @mouseleave="onMouseUp()"
            @dblclick="doFitAll()"
            @wheel.prevent="onWheel($event)"></canvas>
        </div>
        <div style="display:flex;flex-direction:column;gap:var(--size-2);padding:var(--size-2);border-top:1px solid var(--border-dim)">
        <div class="controls" style="margin:0">
          <button @click="$store.playback.toggle()" class="play-btn" :class="$store.playback.playing && 'playing'"
            style="min-width:auto; padding:var(--size-1); width:32px; height:32px; display:flex; align-items:center; justify-content:center;">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"
              x-show="!$store.playback.playing"><polygon points="2,0 14,7 2,14"/></svg>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"
              x-show="$store.playback.playing"><rect x="1" y="0" width="4" height="14"/><rect x="9" y="0" width="4" height="14"/></svg>
          </button>
          <template x-if="$store.playback.mode === 'time'">
            <input type="range" min="0" :max="$store.playback.maxT || 1" step="0.01"
              :value="$store.playback.curT"
              :style="'--pct:' + (($store.playback.maxT ? $store.playback.curT / $store.playback.maxT : 0) * 100) + '%'"
              @input="$store.playback.curT = +$event.target.value; markDirty()">
          </template>
          <template x-if="$store.playback.mode === 'pos'">
            <input type="range" min="0" :max="$store.playback.maxS || 1" step="0.1"
              :value="$store.playback.curS"
              :style="'--pct:' + (($store.playback.maxS ? $store.playback.curS / $store.playback.maxS : 0) * 100) + '%'"
              @input="$store.playback.curS = +$event.target.value; markDirty()">
          </template>
          <small x-show="$store.playback.mode === 'time'"
            x-text="$store.playback.curT.toFixed(1) + 's / ' + $store.playback.maxT.toFixed(1) + 's'"></small>
          <small x-show="$store.playback.mode === 'pos'"
            x-text="$store.playback.curS.toFixed(1) + 'm / ' + $store.playback.maxS.toFixed(1) + 'm'"></small>
          <select x-model.number="$store.playback.speedMul" style="min-width:5em">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
            <option value="8">8x</option>
          </select>
        </div>
        <div class="controls" style="margin:0">
          <div class="seg-group">
            <button :class="$store.playback.mode === 'time' && 'active'"
              @click="$store.playback.mode = 'time'; $store.playback.onModeChange()">Time</button>
            <button :class="$store.playback.mode === 'pos' && 'active'"
              @click="$store.playback.mode = 'pos'; $store.playback.onModeChange()">Position</button>
          </div>
          <div class="baseline-group" :class="$store.playback.mode !== 'pos' && 'disabled'">
            <span>Baseline</span>
            <select x-model.number="$store.models.baselineIdx" @change="$store.playback.onBaselineChange()"
              style="min-width:0;max-width:14em;overflow:hidden;text-overflow:ellipsis">
              <template x-for="(m, i) in $store.data.models" :key="'base'+i">
                <option :value="i" x-text="m.name"></option>
              </template>
            </select>
          </div>
          <div class="toggle-group">
            <label class="toggle-label"><input type="checkbox" x-model="$store.camera.follow"> Track Ego</label>
            <label class="toggle-label"><input type="checkbox" x-model="$store.ui.showPlanned" @change="markDirty()"> Planned Trajectory</label>
            <label class="toggle-label"><input type="checkbox" x-model="$store.ui.showEntities" @change="markDirty()"> Entities</label>
            <label class="toggle-label"><input type="checkbox" x-model="$store.ui.showPerceived" @change="markDirty()"> Object Recognition</label>
          </div>
        </div>
        </div>
      </div>
    </div>
  </template>

  <script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('mapCanvas', function() {
      let ctx = null, canvas = null;
      const drag = { active: false, sx: 0, sy: 0, cx0: 0, cy0: 0 };
      let W = 800, H = 550;
      const d = this.$store.data;
      const cam = this.$store.camera;
      const pb = this.$store.playback;
      const mdl = this.$store.models;
      const ui = this.$store.ui;

      function toScreen(wx, wy) {
        const scale = W / cam.viewW;
        return [
          (wx - cam.cx) * scale + W / 2,
          -(wy - cam.cy) * scale + H / 2
        ];
      }

      function strokePolyline(pts) {
        if (pts.length < 2) return;
        ctx.beginPath();
        const s0 = toScreen(pts[0][0], pts[0][1]);
        ctx.moveTo(s0[0], s0[1]);
        for (let i = 1; i < pts.length; i++) {
          const p = toScreen(pts[i][0], pts[i][1]);
          ctx.lineTo(p[0], p[1]);
        }
        ctx.stroke();
      }

      function updateFollow(samples, vis) {
        const active = samples.filter((s, i) => s && !s.ended && vis[i]);
        if (!active.length) return;
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (let k = 0; k < active.length; k++) {
          const s = active[k];
          if (s.x < minX) minX = s.x; if (s.x > maxX) maxX = s.x;
          if (s.y < minY) minY = s.y; if (s.y > maxY) maxY = s.y;
        }
        const tx = (minX + maxX) / 2, ty = (minY + maxY) / 2;
        if (Math.hypot(tx - cam.cx, ty - cam.cy) > cam.viewW) {
          cam.cx = tx; cam.cy = ty;
        } else {
          cam.cx += (tx - cam.cx) * 0.15;
          cam.cy += (ty - cam.cy) * 0.15;
        }
      }

      function drawMap() {
        ctx.strokeStyle = '#d0d4da'; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (let k = 0; k < (d.map.lanelet_lines || []).length; k++) {
          strokePolyline(d.map.lanelet_lines[k]);
        }
        for (let k = 0; k < d.map.road_markings.length; k++) {
          const rm = d.map.road_markings[k];
          if (rm.type === 'stop_line') { ctx.strokeStyle = '#daa'; ctx.lineWidth = 1.5; }
          else { ctx.strokeStyle = '#d0d4da'; ctx.lineWidth = 1; }
          ctx.globalAlpha = 0.6;
          strokePolyline(rm.points);
        }
        ctx.globalAlpha = 1.0;
      }

      function drawTrajectories(vis) {
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (let i = 0; i < d.models.length; i++) {
          if (!vis[i]) continue;
          const m = d.models[i];
          const nv = m.n_valid;
          if (nv < 2) continue;
          ctx.strokeStyle = m.color; ctx.globalAlpha = 0.3;
          ctx.beginPath();
          const s0 = toScreen(m.x[0], m.y[0]);
          ctx.moveTo(s0[0], s0[1]);
          for (let k = 1; k < nv; k++) {
            const p = toScreen(m.x[k], m.y[k]);
            ctx.lineTo(p[0], p[1]);
          }
          ctx.stroke();
        }
        ctx.globalAlpha = 1.0;
      }

      function drawPlanned(vis, curT) {
        ctx.setLineDash([6, 4]); ctx.lineWidth = 1.5;
        for (let i = 0; i < d.models.length; i++) {
          if (!vis[i]) continue;
          const pf = closestPlanned(d.models[i].planned, curT);
          if (!pf) continue;
          ctx.strokeStyle = d.models[i].color; ctx.globalAlpha = 0.35;
          strokePolyline(pf.points);
        }
        ctx.setLineDash([]); ctx.globalAlpha = 1.0;
      }

      function drawScaleBar(pxPerMeter) {
        const sb = niceScaleBar(pxPerMeter);
        const sbX = W - 20 - sb.px, sbY = H - 25;
        ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.moveTo(sbX, sbY); ctx.lineTo(sbX + sb.px, sbY); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sbX, sbY - 5); ctx.lineTo(sbX, sbY + 5); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sbX + sb.px, sbY - 5); ctx.lineTo(sbX + sb.px, sbY + 5); ctx.stroke();
        ctx.fillStyle = '#555'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(sb.meters >= 1000 ? (sb.meters / 1000) + 'km' : sb.meters + 'm', sbX + sb.px / 2, sbY - 8);
        ctx.globalAlpha = 1.0;
      }

      function sampleEntity(e, t) {
        const pos = e.positions;
        if (!pos.length) return null;
        if (t <= pos[0].t) return pos[0];
        if (t >= pos[pos.length - 1].t) return pos[pos.length - 1];
        let lo = 0, hi = pos.length - 1;
        while (lo < hi - 1) {
          const mid = (lo + hi) >> 1;
          if (pos[mid].t <= t) lo = mid; else hi = mid;
        }
        const a = pos[lo], b = pos[hi];
        const f = (t - a.t) / (b.t - a.t);
        return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, yaw: a.yaw + (b.yaw - a.yaw) * f };
      }

      function drawEntities(samples, pxPerMeter, vis) {
        ctx.lineWidth = 1.5;
        for (let mi = 0; mi < d.models.length; mi++) {
          if (!vis[mi] || !samples[mi]) continue;
          const ents = d.models[mi].entities;
          if (!ents || !ents.length) continue;
          const color = d.models[mi].color;
          const t = samples[mi].t;
          for (let ei = 0; ei < ents.length; ei++) {
            const e = ents[ei];
            const s = sampleEntity(e, t);
            if (!s) continue;
            const sc = toScreen(s.x, s.y);
            const lPx = e.bbox.length * pxPerMeter;
            const wPx = e.bbox.width * pxPerMeter;
            if (lPx < 1 && wPx < 1) continue;
            ctx.save();
            ctx.translate(sc[0], sc[1]);
            ctx.rotate(-s.yaw);
            ctx.fillStyle = color; ctx.globalAlpha = 0.35;
            ctx.fillRect(-lPx / 2, -wPx / 2, lPx, wPx);
            ctx.globalAlpha = 0.7; ctx.strokeStyle = color;
            ctx.strokeRect(-lPx / 2, -wPx / 2, lPx, wPx);
            ctx.restore();
          }
        }
        ctx.globalAlpha = 1.0;
      }

      function _samplePredictedObjects(snapshots, t) {
        if (!snapshots || !snapshots.length) return [];
        let lo = 0, hi = snapshots.length - 1;
        while (lo < hi) {
          const mid = (lo + hi + 1) >> 1;
          if (snapshots[mid].t <= t) lo = mid; else hi = mid - 1;
        }
        return snapshots[lo].objects;
      }

      function drawPerceivedObjects(samples, pxPerMeter, vis, key, dash) {
        for (let mi = 0; mi < d.models.length; mi++) {
          if (!vis[mi] || !samples[mi]) continue;
          const snaps = d.models[mi][key];
          if (!snaps || !snaps.length) continue;
          const color = d.models[mi].color;
          const t = samples[mi].t;
          const objs = _samplePredictedObjects(snaps, t);
          ctx.lineWidth = 1.5; ctx.setLineDash(dash);
          for (let oi = 0; oi < objs.length; oi++) {
            const obj = objs[oi];
            const sc = toScreen(obj.x, obj.y);
            const lPx = obj.length * pxPerMeter;
            const wPx = obj.width * pxPerMeter;
            if (lPx < 1 && wPx < 1) continue;
            ctx.save();
            ctx.translate(sc[0], sc[1]);
            ctx.rotate(-obj.yaw);
            ctx.globalAlpha = 0.25; ctx.fillStyle = color;
            ctx.fillRect(-lPx / 2, -wPx / 2, lPx, wPx);
            ctx.globalAlpha = 0.8; ctx.strokeStyle = color;
            ctx.strokeRect(-lPx / 2, -wPx / 2, lPx, wPx);
            ctx.restore();
          }
        }
        ctx.globalAlpha = 1.0; ctx.setLineDash([]);
      }

      function drawEgo(samples, pxPerMeter, vis) {
        for (let i = d.models.length - 1; i >= 0; i--) {
          const s = samples[i];
          if (!s || !vis[i]) continue;
          const sc = toScreen(s.x, s.y);
          const cx = sc[0], cy = sc[1];
          const color = d.models[i].color;

          if (Math.abs(s.v) > 0.05) {
            const dotR = 6;
            const headLen = 14;
            const shaftLen = Math.abs(s.v) * 1.5 * pxPerMeter;
            const angle = Math.atan2(-Math.sin(s.yaw), Math.cos(s.yaw));
            const dx = Math.cos(angle), dy = Math.sin(angle);
            const ox = cx + dx * dotR, oy = cy + dy * dotR;
            const bx = ox + dx * shaftLen, by = oy + dy * shaftLen;
            const ax = bx + dx * headLen, ay = by + dy * headLen;
            if (shaftLen > 1) {
              ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.globalAlpha = 0.5;
              ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(bx, by); ctx.stroke();
              ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.globalAlpha = 1.0;
              ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(bx, by); ctx.stroke();
            }
            ctx.globalAlpha = 1.0; ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            ctx.lineTo(ax - headLen * Math.cos(angle - 0.3), ay - headLen * Math.sin(angle - 0.3));
            ctx.lineTo(ax - headLen * Math.cos(angle + 0.3), ay - headLen * Math.sin(angle + 0.3));
            ctx.closePath(); ctx.fill();
          }

          ctx.globalAlpha = 1.0; ctx.fillStyle = color;
          ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
      }

      function draw() {
        const dpr = window.devicePixelRatio || 1;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const vis = mdl.visible;
        const scale = W / cam.viewW;

        const samples = d.models.map((m, i) => {
          if (!vis[i] || m.n_valid < 2) return null;
          return pb.mode === 'time' ? d.sampleAtT(m, pb.curT) : d.sampleAtS(m, pb.curS);
        });

        if (cam.follow && pb.playing) updateFollow(samples, vis);

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
        drawMap();
        drawTrajectories(vis);
        const curT = pb.mode === 'time' ? pb.curT : (samples[mdl.baselineIdx] ? samples[mdl.baselineIdx].t : 0);
        if (ui.showPlanned) drawPlanned(vis, curT);
        if (ui.showEntities) drawEntities(samples, scale, vis);
        if (ui.showPerceived)
          drawPerceivedObjects(samples, scale, vis, 'perceived_objects', [4, 3]);
        drawEgo(samples, scale, vis);
        drawScaleBar(scale);
      }

      let needsInitialFit = true;

      function resize(wrap) {
        W = wrap.clientWidth; H = wrap.clientHeight;
        if (W <= 0 || H <= 0) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        if (needsInitialFit) {
          needsInitialFit = false;
          const dx = d.bbox[2] - d.bbox[0], dy = d.bbox[3] - d.bbox[1];
          cam.viewW = Math.max(dx, dy * (W / H), 10) * 1.1;
        }
        markDirty();
      }

      return {
        init() {
          canvas = this.$refs.mapCvs;
          ctx = canvas.getContext('2d');
          new ResizeObserver(() => { resize(canvas.parentElement); }).observe(canvas.parentElement);
          (function loop() {
            if (_dirty) { _dirty = false; draw(); }
            requestAnimationFrame(loop);
          })();
        },
        onMouseDown(e) {
          drag.active = true;
          drag.sx = e.clientX; drag.sy = e.clientY;
          drag.cx0 = cam.cx; drag.cy0 = cam.cy;
        },
        onMouseMove(e) {
          if (!drag.active) return;
          const scale = W / cam.viewW;
          cam.cx = drag.cx0 - (e.clientX - drag.sx) / scale;
          cam.cy = drag.cy0 + (e.clientY - drag.sy) / scale;
          markDirty();
        },
        onMouseUp() { drag.active = false; },
        onWheel(e) {
          const f = e.deltaY > 0 ? 1.1 : 0.9;
          const r = canvas.getBoundingClientRect();
          const mx = e.clientX - r.left, my = e.clientY - r.top;
          const scale = W / cam.viewW;
          const wx = (mx - W / 2) / scale + cam.cx;
          const wy = -(my - H / 2) / scale + cam.cy;
          cam.viewW *= f;
          const ns = W / cam.viewW;
          cam.cx = wx - (mx - W / 2) / ns;
          cam.cy = wy + (my - H / 2) / ns;
          markDirty();
        },
        doFitAll() {
          cam.follow = false;
          const dx = d.bbox[2] - d.bbox[0], dy = d.bbox[3] - d.bbox[1];
          const aspect = W > 0 && H > 0 ? W / H : 1;
          cam.cx = (d.bbox[0] + d.bbox[2]) / 2;
          cam.cy = (d.bbox[1] + d.bbox[3]) / 2;
          cam.viewW = Math.max(dx, dy * aspect, 10) * 1.1;
          markDirty();
        },
      };
    });
  });
  </script>

  <script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('legend', function() {
      const d = this.$store.data;
      const pb = this.$store.playback;
      const mdl = this.$store.models;
      function _sample(i) {
        const m = d.models[i];
        if (m.n_valid < 2) return null;
        return pb.mode === 'time' ? d.sampleAtT(m, pb.curT) : d.sampleAtS(m, pb.curS);
      }
      return {
        hasValidData(i) { return d.models[i].n_valid >= 2; },
        getSample(i) { return _sample(i); },
        isEnded(i) {
          if (!mdl.visible[i]) return false;
          const s = _sample(i);
          return s ? s.ended : false;
        },
      };
    });
  });
  </script>

  document.addEventListener('alpine:init', () => {
    Alpine.data('plotsPanel', function() {
      let plotSvgs = {};
      const d = this.$store.data;
      const pb = this.$store.playback;
      const mdl = this.$store.models;
      const ui = this.$store.ui;
      const margin = { top: 8, right: 12, bottom: 28, left: 50 };
      const plotH = 200;
      const plotDrag = { active: false, wasPlaying: false, startClientX: 0, startX: 0, screenPxPerUnit: 1 };
      let rootEl;

      function chConv(ch) {
        const c = CH_LABELS[ch];
        return (c.conv && c.conv[chUnit[ch]]) || 1;
      }

      function initPlotSvg(ch, cell) {
        const tooltip = cell.querySelector('.plot-tooltip');
        const svgHost = tooltip.parentElement;

        const w = 600, h = plotH + margin.top + margin.bottom;
        const svgEl = d3.select(svgHost).append('svg')
          .attr('class', 'plot-svg')
          .attr('viewBox', '0 0 ' + w + ' ' + h)
          .attr('preserveAspectRatio', 'xMidYMid meet');
        const g = svgEl.append('g')
          .attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');
        const clipId = 'clip-' + ch;
        svgEl.append('defs').append('clipPath').attr('id', clipId)
          .append('rect').attr('width', w - margin.left - margin.right).attr('height', plotH);

        const pw = w - margin.left - margin.right;
        const xScale = d3.scaleLinear().range([0, pw]);
        const yScale = d3.scaleLinear().range([plotH, 0]);
        const gridG = g.append('g');
        const xAxis = g.append('g').attr('transform', 'translate(0,' + plotH + ')');
        const yAxis = g.append('g');
        const linesG = g.append('g').attr('clip-path', 'url(#' + clipId + ')');
        const cursorLine = g.append('line')
          .attr('y1', 0).attr('y2', plotH)
          .attr('stroke', '#333').attr('stroke-width', 1)
          .attr('stroke-dasharray', '4,3').attr('opacity', 0.5);
        const dotsG = g.append('g');
        const hoverLine = g.append('line')
          .attr('y1', 0).attr('y2', plotH)
          .attr('stroke', '#999').attr('stroke-width', 0.8)
          .attr('opacity', 0).attr('pointer-events', 'none');

        const hitArea = g.append('rect')
          .attr('width', pw).attr('height', plotH)
          .attr('fill', 'transparent').attr('cursor', 'ew-resize');

        hitArea.on('mousedown', e => {
          const ctm = g.node().getScreenCTM();
          const domain = xScale.domain();
          plotDrag.active = true;
          plotDrag.wasPlaying = pb.playing;
          plotDrag.startClientX = e.clientX;
          plotDrag.startX = pb.mode === 'pos' ? pb.curS : pb.curT;
          plotDrag.screenPxPerUnit = ctm.a * pw / (domain[1] - domain[0]);
          if (pb.playing) pb.pause();
          e.preventDefault();
        });

        hitArea.on('mousemove', e => {
          const posMode = pb.mode === 'pos';
          const ctm = g.node().getScreenCTM();
          const svgX = (e.clientX - ctm.e) / ctm.a;
          const hoverX = xScale.invert(svgX);
          const conv = chConv(ch);
          const vis = mdl.visible;
          const rows = '';
          if (hoverX >= 0) {
            for (let i = 0; i < d.models.length; i++) {
              if (!vis[i]) continue;
              const val = posMode
                ? d.sampleChannelAtS(d.models[i], ch, hoverX)
                : d.sampleChannel(d.models[i], ch, hoverX);
              if (val === null) continue;
              const v = (val * conv).toFixed(3);
              const unit = CH_LABELS[ch].units[chUnit[ch]];
              rows += '<div class="tt-row"><span class="tt-dot" style="background:' + d.models[i].color + '"></span><span>' + v + ' ' + unit + '</span></div>';
            }
          }
          if (rows) {
            const hx = xScale(hoverX);
            hoverLine.attr('x1', hx).attr('x2', hx).attr('opacity', 0.6);
            const label = posMode ? hoverX.toFixed(1) + 'm' : hoverX.toFixed(2) + 's';
            tooltip.innerHTML = '<div style="color:var(--text);margin-bottom:2px">' + label + '</div>' + rows;
            tooltip.style.display = 'block';
            const cellRect = cell.getBoundingClientRect();
            let tx = e.clientX - cellRect.left + 12;
            if (tx + 140 > cellRect.width) tx = e.clientX - cellRect.left - 140;
            tooltip.style.left = tx + 'px';
            tooltip.style.top = (e.clientY - cellRect.top - 10) + 'px';
          } else {
            tooltip.style.display = 'none';
            hoverLine.attr('opacity', 0);
          }
        });
        hitArea.on('mouseleave', () => {
          tooltip.style.display = 'none';
          hoverLine.attr('opacity', 0);
        });

        plotSvgs[ch] = { xScale: xScale, yScale: yScale, gridG: gridG, xAxis: xAxis, yAxis: yAxis, linesG: linesG, cursorLine: cursorLine, dotsG: dotsG, pw: pw };
      }

      function initAllPlots() {
        plotSvgs = {};
        rootEl.querySelectorAll('.plot-cell[data-ch]').forEach(cell => {
          const ch = cell.dataset.ch;
          if (d.models.some(m => m.ch[ch])) initPlotSvg(ch, cell);
        });
        d3.select(window).on('mousemove.plot', e => {
          if (!plotDrag.active) return;
          const dx = -(e.clientX - plotDrag.startClientX) / plotDrag.screenPxPerUnit;
          if (pb.mode === 'pos') {
            pb.curS = Math.max(0, Math.min(plotDrag.startX + dx, pb.maxS));
          } else {
            pb.curT = Math.max(0, Math.min(plotDrag.startX + dx, pb.maxT));
          }
          markDirty();
        }).on('mouseup.plot', () => {
          if (!plotDrag.active) return;
          plotDrag.active = false;
          if (plotDrag.wasPlaying) pb.resume();
        });
      }

      function updateChannel(ch, curX, vis, posMode) {
        const p = plotSvgs[ch];
        if (!p) return;
        const conv = chConv(ch);

        let xMin, xMax;
        if (posMode) {
          const wm = ui.plotWindowM;
          if (wm > 0) { xMin = curX - wm / 2; xMax = curX + wm / 2; }
          else { xMin = 0; xMax = pb.maxS; }
        } else {
          const ws = ui.plotWindowS;
          if (ws > 0) { xMin = curX - ws / 2; xMax = curX + ws / 2; }
          else { xMin = 0; xMax = pb.maxT; }
        }
        p.xScale.domain([xMin, xMax]);

        const cmdCh = CH_CMD[ch] || null;
        let yMin = Infinity, yMax = -Infinity;
        for (let i = 0; i < d.models.length; i++) {
          if (!vis[i]) continue;
          const keys = [ch, cmdCh];
          for (let ki = 0; ki < keys.length; ki++) {
            const arr = keys[ki] && d.models[i].ch[keys[ki]];
            if (!arr) continue;
            for (let k = 0; k < d.models[i].n_valid; k++) {
              if (arr[k] !== null) {
                const cv = arr[k] * conv;
                if (cv < yMin) yMin = cv;
                if (cv > yMax) yMax = cv;
              }
            }
          }
        }
        if (!isFinite(yMin)) { yMin = -1; yMax = 1; }
        const yPad = (yMax - yMin) * 0.08 || 0.5;
        p.yScale.domain([yMin - yPad, yMax + yPad]);

        const xUnit = posMode ? 'm' : 's';
        const tickColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
        const lineColor = getComputedStyle(document.documentElement).getPropertyValue('--border-dim').trim();
        p.xAxis.call(d3.axisBottom(p.xScale).ticks(5).tickFormat(v => v.toFixed(0) + xUnit))
          .selectAll('text').attr('fill', tickColor).style('font-size', 'var(--fs-xs)');
        p.xAxis.selectAll('line,path').attr('stroke', lineColor);
        const yRange = p.yScale.domain();
        const ySpan = Math.abs(yRange[1] - yRange[0]);
        const yPrec = ySpan < 0.01 ? 4 : ySpan < 0.1 ? 3 : ySpan < 1 ? 2 : 1;
        p.yAxis.call(d3.axisLeft(p.yScale).ticks(4).tickFormat(d3.format('.' + yPrec + 'f')))
          .selectAll('text').attr('fill', tickColor).style('font-size', 'var(--fs-xs)');
        p.yAxis.selectAll('line,path').attr('stroke', lineColor);

        p.gridG.selectAll('*').remove();
        p.xScale.ticks(5).forEach(t => {
          p.gridG.append('line')
            .attr('x1', p.xScale(t)).attr('x2', p.xScale(t))
            .attr('y1', 0).attr('y2', plotH)
            .attr('stroke', '#e0e0e0').attr('stroke-dasharray', '2,3');
        });
        p.yScale.ticks(4).forEach(t => {
          p.gridG.append('line')
            .attr('x1', 0).attr('x2', p.pw)
            .attr('y1', p.yScale(t)).attr('y2', p.yScale(t))
            .attr('stroke', '#e0e0e0').attr('stroke-dasharray', '2,3');
        });

        p.linesG.selectAll('*').remove();
        const lineFn = d3.line().defined(dd => dd.v !== null)
          .x(dd => p.xScale(dd.x)).y(dd => p.yScale(dd.v));
        for (let i = 0; i < d.models.length; i++) {
          if (!vis[i]) continue;
          const m = d.models[i];
          const nv = m.n_valid;
          const arr = m.ch[ch];
          if (arr) {
            const lineData = [];
            for (let k = 0; k < nv; k++) {
              const xv = posMode ? m.s[k] : k / d.rate;
              lineData.push({ x: xv, v: arr[k] !== null ? arr[k] * conv : null });
            }
            p.linesG.append('path').datum(lineData)
              .attr('fill', 'none').attr('stroke', m.color)
              .attr('stroke-width', 1.5).attr('d', lineFn);
          }
          const cmdArr = cmdCh && m.ch[cmdCh];
          if (cmdArr) {
            const cmdData = [];
            for (let k = 0; k < nv; k++) {
              const xv = posMode ? m.s[k] : k / d.rate;
              cmdData.push({ x: xv, v: cmdArr[k] !== null ? cmdArr[k] * conv : null });
            }
            p.linesG.append('path').datum(cmdData)
              .attr('fill', 'none').attr('stroke', m.color)
              .attr('stroke-width', 1.2).attr('stroke-dasharray', '4,3')
              .attr('opacity', 0.5).attr('d', lineFn);
          }
        }

        const cx = p.xScale(curX);
        p.cursorLine.attr('x1', cx).attr('x2', cx)
          .attr('opacity', cx >= 0 && cx <= p.pw ? 0.5 : 0);

        p.dotsG.selectAll('*').remove();
        for (let i = 0; i < d.models.length; i++) {
          if (!vis[i]) continue;
          const val = posMode
            ? d.sampleChannelAtS(d.models[i], ch, curX)
            : d.sampleChannel(d.models[i], ch, curX);
          if (val === null) continue;
          p.dotsG.append('circle')
            .attr('cx', p.xScale(curX)).attr('cy', p.yScale(val * conv)).attr('r', 3.5)
            .attr('fill', d.models[i].color).attr('stroke', '#fff').attr('stroke-width', 1.5);
        }
      }

      function updateAll() {
        if (!Object.keys(plotSvgs).length) return;
        const vis = mdl.visible;
        const posMode = pb.mode === 'pos';
        const curX = posMode ? pb.curS : pb.curT;
        for (let ci = 0; ci < CHANNELS.length; ci++) updateChannel(CHANNELS[ci], curX, vis, posMode);
      }

      return {
        channels: CHANNELS,
        units: {},

        hasData(ch) { return d ? d.models.some(m => m.ch[ch]) : false; },
        legendItems(ch) {
          const items = [{label: 'Actual', dash: null}];
          if (CH_CMD[ch]) items.push({label: 'Command', dash: '4,3'});
          return items;
        },
        hasMultiUnits(ch) { return CH_LABELS[ch].units.length > 1; },
        currentUnit(ch) { return CH_LABELS[ch].units[this.units[ch] || 0]; },
        chLabel(ch) {
          const c = CH_LABELS[ch];
          return c.name + ' [' + c.units[this.units[ch] || 0] + ']';
        },
        toggleUnit(ch) {
          const info = CH_LABELS[ch];
          this.units[ch] = ((this.units[ch] || 0) + 1) % info.units.length;
          chUnit[ch] = this.units[ch];
          markDirty();
        },

        init() {
          rootEl = this.$el;
          this.units = {};
          CHANNELS.forEach(ch => { this.units[ch] = 0; });
          this.$nextTick(() => { initAllPlots(); });
          (function loop() { if (_dirty) updateAll(); requestAnimationFrame(loop); })();
        },
      };
    });
  });
  </script>

  <template id="num-comp-tmpl">

    </style>
    <div id="root" x-data="numComp">
      <div class="controls" style="margin:0 0 var(--size-2)">
        <span style="color:var(--text)">Baseline</span>
        <select x-model.number="baseIdx" style="min-width:0;max-width:14em;overflow:hidden;text-overflow:ellipsis">
          <template x-for="(m, i) in $store.data.models" :key="'nb'+i">
            <option :value="i" x-text="m.name"></option>
          </template>
        </select>
      </div>
      <div class="num-comp-wrap">
        <table class="num-comp">
          <thead>
            <tr class="group-header">
              <template x-for="(g, gi) in groups" :key="'g'+gi">
                <th :colspan="g.cols.length" x-text="g.header"
                    :class="g.cols[0].key === 'model' && 'nc-model'"></th>
              </template>
            </tr>
            <tr>
              <template x-for="(c, ci) in allCols" :key="'h'+ci">
                <th :class="c.key === 'model' && 'nc-model'">
                  <span :class="c.tip && 'nc-hint'" :data-tip="c.tip"
                        @mouseenter="showTip" @mouseleave="hideTip"
                        x-text="c.label"></span><br x-show="c.unit"><span class="nc-unit" x-show="c.unit" x-text="'[' + c.unit + ']'"></span>
                </th>
              </template>

          </thead>
          <tbody>
            <template x-for="(row, ri) in rows" :key="'r'+ri">
              <tr :class="ri === baseIdx && 'highlight'">
                <template x-for="(c, ci) in allCols" :key="'d'+ci">
                  <td :class="c.key === 'model' && 'nc-model'"
                      :style="c.key === 'model' ? 'border-left:10px solid ' + row.color : ''"
                      :title="c.key === 'model' ? row.model : null">
                    <template x-if="c.key === 'model'">
                      <span x-text="row.model"></span>
                    </template>
                    <template x-if="c.key !== 'model'">
                      <span x-text="fmt(row[c.key])"></span>
                    </template>
                  </td>
                </template>
              </tr>
            </template>

      <div class="nc-tip" :class="{ visible: tipVisible }"
           :style="'left:' + tipX + 'px;top:' + tipY + 'px'"
           x-text="tipText"></div>
    </div>
  </template>

  <script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('numComp', function() {
      const d = this.$store.data;
      const LATERAL_THRESH = 15.0;
      const BRAKE_THRESHOLD = -1.0;
      const TURN_LEFT = 2, TURN_RIGHT = 3;

      const GROUPS = [
        { header: '', cols: [
          { key: 'model', label: 'Model' },
        ]},
        { header: 'Correspondence', cols: [
          { key: 'match_valid_pct', label: 'Valid', unit: '%',
            tip: 'Share of samples with\nlateral distance ≤ ' + LATERAL_THRESH.toFixed(0) + ' m' },
          { key: 'median_lateral_m', label: 'Median lateral', unit: 'm',
            tip: 'Median lateral distance\nat arc-length matched points' },
          { key: 'max_lateral_m', label: 'Max lateral', unit: 'm',
            tip: 'Maximum lateral distance\nat arc-length matched points' },
        ]},
        { header: 'Speed difference', cols: [
          { key: 'mean_dv', label: 'Mean Δv', unit: 'm/s',
            tip: 'Mean speed difference\n(model − baseline)' },
          { key: 'median_dv', label: 'Median Δv', unit: 'm/s',
            tip: 'Median speed difference\n(model − baseline)' },
          { key: 'avg_over', label: 'Avg overspeed', unit: 'm/s',
            tip: 'Mean of positive Δv\n(model faster than baseline)' },
          { key: 'avg_under', label: 'Avg underspeed', unit: 'm/s',
            tip: 'Mean of negative Δv\n(model slower than baseline)' },
          { key: 'peak_over', label: 'Peak Δv+', unit: 'm/s',
            tip: 'Largest positive Δv\n(max excess over baseline)' },
          { key: 'peak_under', label: 'Peak Δv−', unit: 'm/s',
            tip: 'Largest negative Δv\n(max deficit vs baseline)' },
        ]},
        { header: 'Turn indicator', cols: [
          { key: 'ti_clusters', label: 'Clusters',
            tip: 'Turn-indicator clusters\non the baseline path' },
          { key: 'ti_missing', label: 'Missing',
            tip: 'Baseline clusters with\nno matching model signal' },
          { key: 'ti_mean_iou', label: 'Mean IoU',
            tip: 'Arc-length IoU of matched\nturn-indicator clusters' },
        ]},
        { header: 'Operational', cols: [
          { key: 'strong_brakes', label: 'Strong brakes',
            tip: 'Consecutive intervals with\nacceleration ≤ −1.0 m/s²' },
        ]},
      ];

      const ALL_COLS = GROUPS.flatMap(g => g.cols);

      function fmtVal(v) {
        if (v == null || (typeof v === 'number' && !isFinite(v))) return '—';
        if (typeof v === 'number') {
          if (Number.isInteger(v)) return String(v);
          if (Math.abs(v) < 10) return v.toFixed(3);
          return v.toFixed(1);
        }
        return String(v);
      }

      function interpAtS(m, s) {
        const nv = m.n_valid;
        if (nv < 2) return null;
        const sc = Math.min(Math.max(s, 0), m.s_total);
        let lo = 0, hi = nv;
        while (lo < hi) { const mid = (lo + hi) >> 1; m.s[mid] <= sc ? lo = mid + 1 : hi = mid; }
        const j = Math.min(Math.max(lo, 1), nv - 1);
        const ii = j - 1;
        const ds = m.s[j] - m.s[ii];
        const f = ds > 1e-9 ? (sc - m.s[ii]) / ds : 0;
        return {
          x: m.x[ii] + (m.x[j] - m.x[ii]) * f,
          y: m.y[ii] + (m.y[j] - m.y[ii]) * f,
          v: m.v[ii] + (m.v[j] - m.v[ii]) * f,
        };
      }

      function median(arr) {
        if (!arr.length) return NaN;
        const s = arr.slice().sort((a, b) => a - b);
        const m = Math.floor(s.length / 2);
        return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
      }

      function findTurnClusters(m) {
        const cmd = m.ch && m.ch.turn_cmd;
        if (!cmd) return [];
        const clusters = [];
        let cur = null;
        for (let k = 0; k < m.n_valid; k++) {
          const c = cmd[k];
          if (c === TURN_LEFT || c === TURN_RIGHT) {
            if (!cur || cur.dir !== c) {
              if (cur) clusters.push(cur);
              cur = { dir: c, s0: m.s[k], s1: m.s[k] };
            } else { cur.s1 = m.s[k]; }
          } else {
            if (cur) { clusters.push(cur); cur = null; }
          }
        }
        if (cur) clusters.push(cur);
        return clusters;
      }

      function compareTurnIndicators(baseClusters, candClusters) {
        let matched = 0, missing = 0, iouSum = 0;
        for (let bi = 0; bi < baseClusters.length; bi++) {
          const bc = baseClusters[bi];
          let bestIou = 0;
          for (let ci = 0; ci < candClusters.length; ci++) {
            const cc = candClusters[ci];
            if (cc.dir !== bc.dir) continue;
            const i0 = Math.max(bc.s0, cc.s0), i1 = Math.min(bc.s1, cc.s1);
            if (i1 <= i0) continue;
            const inter = i1 - i0;
            const union = (bc.s1 - bc.s0) + (cc.s1 - cc.s0) - inter;
            const iou = union > 0 ? inter / union : 0;
            if (iou > bestIou) bestIou = iou;
          }
          if (bestIou > 0) { matched++; iouSum += bestIou; }
          else missing++;
        }
        return {
          clusters: baseClusters.length,
          missing: missing,
          meanIou: matched > 0 ? iouSum / matched : NaN,
        };
      }

      function countStrongBrakes(m) {
        const accel = m.ch && m.ch.accel;
        if (!accel) return 0;
        let count = 0, braking = false;
        for (let k = 0; k < m.n_valid; k++) {
          if (accel[k] != null && accel[k] <= BRAKE_THRESHOLD) {
            if (!braking) { count++; braking = true; }
          } else braking = false;
        }
        return count;
      }

      function candidateRow(cand, base) {
        const sMax = Math.min(base.s_total, cand.s_total);
        const nBase = base.n_valid;
        const laterals = [], deltaVs = [];
        for (let k = 0; k < nBase; k++) {
          const bs = base.s[k];
          if (bs > sMax) break;
          const cs = interpAtS(cand, bs);
          if (!cs) continue;
          const dx = cs.x - base.x[k], dy = cs.y - base.y[k];
          laterals.push(Math.sqrt(dx * dx + dy * dy));
          deltaVs.push(cs.v - (base.v[k] || 0));
        }
        const n = deltaVs.length;
        const validCnt = laterals.filter(l => l <= LATERAL_THRESH).length;
        let overSum = 0, underSum = 0;
        for (let di = 0; di < deltaVs.length; di++) {
          if (deltaVs[di] > 0) overSum += deltaVs[di]; else underSum += deltaVs[di];
        }
        const ti = compareTurnIndicators(findTurnClusters(base), findTurnClusters(cand));
        return {
          model: cand.name, color: cand.color,
          match_valid_pct: n > 0 ? (validCnt / n) * 100 : 0,
          median_lateral_m: median(laterals),
          max_lateral_m: laterals.length ? Math.max(...laterals) : NaN,
          mean_dv: n > 0 ? deltaVs.reduce((a, b) => a + b, 0) / n : NaN,
          median_dv: median(deltaVs),
          avg_over: n > 0 ? overSum / n : 0,
          avg_under: n > 0 ? underSum / n : 0,
          peak_over: n > 0 ? Math.max(...deltaVs) : NaN,
          peak_under: n > 0 ? Math.min(...deltaVs) : NaN,
          ti_clusters: ti.clusters, ti_missing: ti.missing, ti_mean_iou: ti.meanIou,
          strong_brakes: countStrongBrakes(cand),
        };
      }

      function referenceRow(base) {
        return {
          model: base.name, color: base.color,
          match_valid_pct: 100.0,
          median_lateral_m: 0.0, max_lateral_m: 0.0,
          mean_dv: 0.0, median_dv: 0.0,
          avg_over: 0.0, avg_under: 0.0,
          peak_over: 0.0, peak_under: 0.0,
          ti_clusters: NaN, ti_missing: NaN, ti_mean_iou: NaN,
          strong_brakes: countStrongBrakes(base),
        };
      }

      return {
        baseIdx: 0,
        rows: [],
        groups: GROUPS,
        allCols: ALL_COLS,
        tipVisible: false,
        tipText: '',
        tipX: 0,
        tipY: 0,
        fmt: fmtVal,

        showTip(e) {
          const tip = e.target.dataset.tip;
          if (!tip) return;
          this.tipText = tip;
          const r = e.target.getBoundingClientRect();
          this.tipX = r.left;
          this.tipY = r.bottom + 6;
          this.tipVisible = true;
        },
        hideTip() { this.tipVisible = false; },

        computeRows() {
          const base = d.models[this.baseIdx];
          this.rows = d.models.map((m, i) => {
            return i === this.baseIdx ? referenceRow(m) : candidateRow(m, base);
          });
        },

        init() {
          this.$watch('baseIdx', () => { this.computeRows(); });
          this.$nextTick(() => { this.computeRows(); });
        },
      };
    });
  });
  </script>

  <template id="static-figures-tmpl">
    <style>
      .static-figures {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--size-3);
      }
      @media (max-width: 768px) { .static-figures { grid-template-columns: 1fr; } }
      .static-fig {
        background: var(--surface-2);
        border: 1px solid var(--border-dim);
        border-radius: var(--radius-2);
        overflow: hidden;
        box-shadow: var(--card-shadow);
      }
      .static-fig-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: var(--size-2) var(--size-3);
        border-bottom: 1px solid var(--border-dim);
        border-left: 10px solid var(--model-color);
        background: var(--surface-3);
        min-width: 0; gap: var(--size-2);
      }
      .static-fig-header > div:first-child { min-width: 0; flex: 1; }
      .static-fig-title {
        font-size: var(--fs-sm); font-weight: 600; margin: 0;
        color: var(--text);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        max-width: 100%;
      }
      .static-fig-subtitle { font-size: var(--fs-xs); color: var(--text); margin: 0; }
      .static-fig-body { position: relative; }
      .static-fig-body canvas { display: block; width: 100%; }
      .static-fig-colorbar {
        position: absolute; bottom: 12px; left: 16px;
        background: rgba(255,255,255,0.9); border: 1px solid var(--border-dim);
        border-radius: var(--radius-1); padding: 6px 10px;
        font-size: var(--fs-xs); color: var(--text);
        display: flex; align-items: center; gap: 8px;
      }
      .static-fig-colorbar canvas {
        width: 120px; height: 12px; border-radius: 2px;
        border: 1px solid var(--border-dim);
      }
      .static-fig-legend {
        display: flex; flex-wrap: wrap; gap: var(--size-2) var(--size-3);
        padding: var(--size-2) var(--size-3);
        border-top: 1px solid var(--border-dim);
        font-size: var(--fs-sm); color: var(--text);
      }
      .static-fig-legend-item { display: flex; align-items: center; gap: 5px; }
      .static-fig-legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
      .static-fig-legend-line { width: 16px; height: 3px; border-radius: 1px; flex-shrink: 0; }
    </style>
    <div id="root" x-data="staticFigures">
      <div class="static-figures">
        <template x-for="(m, mi) in $store.data.models" :key="'sf'+mi">
          <div class="static-fig">
            <div class="static-fig-header" :style="'--model-color:' + m.color">
              <div>
                <p class="static-fig-title" x-text="m.name" :title="m.name"></p>
                <p class="static-fig-subtitle">Speed-colored trajectory</p>
              </div>
              <div style="display:flex;gap:var(--size-2);align-items:center">
                <label class="toggle-label" style="font-size:var(--fs-sm)">
                  <input type="checkbox" :checked="sfOpts[mi].showBraking" @change="sfOpts[mi].showBraking=$el.checked; drawFigure(mi)"> Braking
                </label>
                <label class="toggle-label" style="font-size:var(--fs-sm)">
                  <input type="checkbox" :checked="sfOpts[mi].showTurnCmd" @change="sfOpts[mi].showTurnCmd=$el.checked; drawFigure(mi)"> Turn Indicators
                </label>
              </div>
            </div>
            <div class="static-fig-body">
              <canvas :data-sf-idx="mi" style="height:var(--sf-canvas-h)"></canvas>
              <div class="static-fig-colorbar">
                <span>0</span>
                <canvas :data-sf-bar="mi" width="120" height="12"></canvas>
                <span x-text="vMax(mi).toFixed(1) + ' m/s'"></span>
              </div>
            </div>
            <div class="static-fig-legend">
              <div class="static-fig-legend-item">
                <svg width="10" height="10" viewBox="0 0 10 10" style="flex-shrink:0"><polygon points="10,0 0,5 10,10" fill="#e88a2a"/></svg><span>LEFT indicator</span>
              </div>
              <div class="static-fig-legend-item">
                <svg width="10" height="10" viewBox="0 0 10 10" style="flex-shrink:0"><polygon points="0,0 10,5 0,10" fill="#30b0c0"/></svg><span>RIGHT indicator</span>
              </div>
              <div class="static-fig-legend-item">
                <svg width="10" height="10" viewBox="0 0 10 10" style="flex-shrink:0"><polygon points="0,0 10,0 5,10" fill="#c03030"/></svg><span>Strong braking (≤ −1.0 m/s²)</span>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('staticFigures', function() {
      const d = this.$store.data;
      const BRAKE_THRESHOLD = -1.0;
      const TURN_LEFT = 2, TURN_RIGHT = 3;
      let rootEl;

      const _CB_RDYLBU_R = [
        [49,54,149],[69,117,180],[116,173,209],[171,217,233],[224,243,248],
        [255,255,191],[254,224,144],[253,174,97],[244,109,67],[215,48,39],[165,0,38]
      ];
      function speedToColor(v, vMax) {
        const t = vMax > 0 ? Math.min(v / vMax, 1) : 0;
        const n = _CB_RDYLBU_R.length - 1;
        const fi = t * n;
        const i = Math.min(Math.floor(fi), n - 1);
        const f = fi - i;
        const a = _CB_RDYLBU_R[i], b = _CB_RDYLBU_R[i + 1];
        return 'rgb(' + Math.round(a[0]+(b[0]-a[0])*f) + ',' + Math.round(a[1]+(b[1]-a[1])*f) + ',' + Math.round(a[2]+(b[2]-a[2])*f) + ')';
      }

      function computeBBox(m) {
        const nv = m.n_valid;
        if (nv < 2) return [0, 0, 1, 1];
        let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
        for (let k = 0; k < nv; k++) {
          if (m.x[k] < xMin) xMin = m.x[k];
          if (m.x[k] > xMax) xMax = m.x[k];
          if (m.y[k] < yMin) yMin = m.y[k];
          if (m.y[k] > yMax) yMax = m.y[k];
        }
        return [xMin, yMin, xMax, yMax];
      }

      function drawStaticMap(ctx, mapData, toScr) {
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.globalAlpha = 0.5;
        const lines = mapData.lanelet_lines || [];
        for (let li = 0; li < lines.length; li++) {
          const line = lines[li];
          if (line.length < 2) continue;
          ctx.strokeStyle = '#d0d4da'; ctx.lineWidth = 1;
          ctx.beginPath();
          const s0 = toScr(line[0][0], line[0][1]);
          ctx.moveTo(s0[0], s0[1]);
          for (let pi = 1; pi < line.length; pi++) {
            const p = toScr(line[pi][0], line[pi][1]);
            ctx.lineTo(p[0], p[1]);
          }
          ctx.stroke();
        }
        const rms = mapData.road_markings || [];
        for (let ri = 0; ri < rms.length; ri++) {
          const rm = rms[ri];
          ctx.strokeStyle = rm.type === 'stop_line' ? '#daa' : '#d0d4da';
          ctx.lineWidth = rm.type === 'stop_line' ? 2 : 1;
          if (rm.points.length < 2) continue;
          ctx.beginPath();
          const s0 = toScr(rm.points[0][0], rm.points[0][1]);
          ctx.moveTo(s0[0], s0[1]);
          for (let pi = 1; pi < rm.points.length; pi++) {
            const p = toScr(rm.points[pi][0], rm.points[pi][1]);
            ctx.lineTo(p[0], p[1]);
          }
          ctx.stroke();
        }
        ctx.globalAlpha = 1.0;
      }

      function drawSpeedTrajectory(ctx, m, vMax, toScr) {
        const nv = m.n_valid;
        if (nv < 2) return;
        ctx.lineWidth = 5; ctx.lineCap = 'round';
        for (let k = 0; k < nv - 1; k++) {
          const v = m.v[k] != null ? Math.abs(m.v[k]) : 0;
          ctx.strokeStyle = speedToColor(v, vMax);
          ctx.beginPath();
          const p1 = toScr(m.x[k], m.y[k]);
          const p2 = toScr(m.x[k + 1], m.y[k + 1]);
          ctx.moveTo(p1[0], p1[1]);
          ctx.lineTo(p2[0], p2[1]);
          ctx.stroke();
        }
      }

      const MARKER_INTERVAL = 5;

      function drawMarker(ctx, sx, sy, shape, color) {
        ctx.fillStyle = color;
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        if (shape === 'left') {
          ctx.moveTo(sx - 7, sy);
          ctx.lineTo(sx + 3, sy - 6);
          ctx.lineTo(sx + 3, sy + 6);
        } else if (shape === 'right') {
          ctx.moveTo(sx + 7, sy);
          ctx.lineTo(sx - 3, sy - 6);
          ctx.lineTo(sx - 3, sy + 6);
        } else {
          ctx.moveTo(sx, sy + 7);
          ctx.lineTo(sx - 6, sy - 3);
          ctx.lineTo(sx + 6, sy - 3);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }

      function drawTurnIndicators(ctx, m, toScr) {
        const arr = m.ch && m.ch.turn_cmd;
        if (!arr) return;
        const nv = m.n_valid;
        for (let k = 0; k < nv; k += MARKER_INTERVAL) {
          const cmd = arr[k];
          if (cmd !== TURN_LEFT && cmd !== TURN_RIGHT) continue;
          const p = toScr(m.x[k], m.y[k]);
          drawMarker(ctx, p[0], p[1],
            cmd === TURN_LEFT ? 'left' : 'right',
            cmd === TURN_LEFT ? '#e88a2a' : '#30b0c0');
        }
      }

      function drawBrakingOverlay(ctx, m, toScr) {
        const accel = m.ch && m.ch.accel;
        if (!accel) return;
        const nv = m.n_valid;
        for (let k = 0; k < nv; k += MARKER_INTERVAL) {
          if (accel[k] === null || accel[k] >= BRAKE_THRESHOLD) continue;
          const p = toScr(m.x[k], m.y[k]);
          drawMarker(ctx, p[0], p[1], 'down', '#c03030');
        }
      }

      function drawScaleBar(ctx, pxPerMeter, W, H) {
        const sb = niceScaleBar(pxPerMeter);
        const sbX = W - 20 - sb.px, sbY = H - 20;
        ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.moveTo(sbX, sbY); ctx.lineTo(sbX + sb.px, sbY); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sbX, sbY - 4); ctx.lineTo(sbX, sbY + 4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sbX + sb.px, sbY - 4); ctx.lineTo(sbX + sb.px, sbY + 4); ctx.stroke();
        ctx.fillStyle = '#555'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(sb.meters >= 1000 ? (sb.meters / 1000) + 'km' : sb.meters + 'm', sbX + sb.px / 2, sbY - 7);
        ctx.globalAlpha = 1.0;
      }

      function drawColorbar(barCanvas, vMax) {
        const ctx = barCanvas.getContext('2d');
        const w = barCanvas.width, h = barCanvas.height;
        for (let px = 0; px < w; px++) {
          ctx.fillStyle = speedToColor((px / w) * vMax, vMax);
          ctx.fillRect(px, 0, 1, h);
        }
      }

      const SF_CANVAS_H = 380;
      const cameras = [];

      function initCamera(m, W, H) {
        const bb = computeBBox(m);
        const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;
        const dx = bb[2] - bb[0], dy = bb[3] - bb[1];
        const aspect = (W && H) ? W / H : 1.6;
        const span = Math.max(dx, dy * aspect, 10) * 1.15;
        return { cx: cx, cy: cy, span: span };
      }

      return {
        sfOpts: [],

        vMax(mi) {
          const m = d.models[mi];
          let mx = 0;
          for (let k = 0; k < m.n_valid; k++) {
            const v = m.v[k] != null ? Math.abs(m.v[k]) : 0;
            if (v > mx) mx = v;
          }
          return mx || 1;
        },

        hasTurnCmd(mi) {
          return !!(d.models[mi].ch && d.models[mi].ch.turn_cmd);
        },

        drawFigure(mi) {
          const canvas = rootEl.querySelector('canvas[data-sf-idx="' + mi + '"]');
          const barCanvas = rootEl.querySelector('canvas[data-sf-bar="' + mi + '"]');
          if (!canvas) return;
          const m = d.models[mi];
          if (m.n_valid < 2) return;
          const dpr = window.devicePixelRatio || 1;
          const W = canvas.parentElement.clientWidth || canvas.offsetWidth || 800;
          const H = SF_CANVAS_H;
          if (!cameras[mi]) cameras[mi] = initCamera(m, W, H);
          const cam = cameras[mi];
          if (W < 10) return;
          canvas.width = Math.round(W * dpr);
          canvas.height = Math.round(H * dpr);
          canvas.style.width = W + 'px';
          canvas.style.height = H + 'px';

          const ctx = canvas.getContext('2d');
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const scale = W / cam.span;

          function toScr(wx, wy) {
            return [
              (wx - cam.cx) * scale + W / 2,
              -(wy - cam.cy) * scale + H / 2
            ];
          }

          ctx.clearRect(0, 0, W, H);
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);

          drawStaticMap(ctx, d.map, toScr);

          const vm = this.vMax(mi);

          drawSpeedTrajectory(ctx, m, vm, toScr);
          if (this.sfOpts[mi].showTurnCmd) drawTurnIndicators(ctx, m, toScr);
          if (this.sfOpts[mi].showBraking) drawBrakingOverlay(ctx, m, toScr);

          drawScaleBar(ctx, scale, W, H);
          if (barCanvas) drawColorbar(barCanvas, vm);
        },

        drawAll() {
          for (let mi = 0; mi < d.models.length; mi++) this.drawFigure(mi);
        },

        init() {
          rootEl = this.$el;
          this.sfOpts = d.models.map(() => ({ showBraking: true, showTurnCmd: true }));
          const self = this;

          setTimeout(() => {
            self.drawAll();

            rootEl.querySelectorAll('canvas[data-sf-idx]').forEach(canvas => {
              const mi = parseInt(canvas.dataset.sfIdx);
              const drag = { active: false, sx: 0, sy: 0, cx0: 0, cy0: 0 };

              canvas.style.cursor = 'grab';

              canvas.addEventListener('mousedown', e => {
                const cam = cameras[mi];
                if (!cam) return;
                drag.active = true;
                drag.sx = e.clientX; drag.sy = e.clientY;
                drag.cx0 = cam.cx; drag.cy0 = cam.cy;
                canvas.style.cursor = 'grabbing';
                e.preventDefault();
              });

              canvas.addEventListener('mousemove', e => {
                if (!drag.active) return;
                const cam = cameras[mi];
                const W = canvas.clientWidth || 800;
                const scale = W / cam.span;
                cam.cx = drag.cx0 - (e.clientX - drag.sx) / scale;
                cam.cy = drag.cy0 + (e.clientY - drag.sy) / scale;
                self.drawFigure(mi);
              });

              canvas.addEventListener('mouseup', () => {
                drag.active = false; canvas.style.cursor = 'grab';
              });
              canvas.addEventListener('mouseleave', () => {
                drag.active = false; canvas.style.cursor = 'grab';
              });

              canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const cam = cameras[mi];
                if (!cam) return;
                const W = canvas.clientWidth || 800;
                const H = SF_CANVAS_H;
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const scale = W / cam.span;
                const wx = (mx - W / 2) / scale + cam.cx;
                const wy = -(my - H / 2) / scale + cam.cy;
                const f = e.deltaY > 0 ? 1.15 : 1 / 1.15;
                cam.span *= f;
                const ns = W / cam.span;
                cam.cx = wx - (mx - W / 2) / ns;
                cam.cy = wy + (my - H / 2) / ns;
                self.drawFigure(mi);
              }, { passive: false });

              canvas.addEventListener('dblclick', () => {
                const W = canvas.clientWidth || 800;
                cameras[mi] = initCamera(d.models[mi], W, SF_CANVAS_H);
                self.drawFigure(mi);
              });
            });
          }, 100);

          window.addEventListener('resize', () => { self.drawAll(); });
        },
      };
    });
  });
  </script>
